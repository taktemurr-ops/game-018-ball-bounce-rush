name: Flutter checks and Android debug
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Verify Android project
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Android project files are missing"
            exit 1
          fi
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: game-018-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
